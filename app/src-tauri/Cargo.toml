[package]
name = "msh-app"
description = "My Sweet Home desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "msh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
msh-core.workspace = true
msh-model.workspace = true
msh-format.workspace = true
msh-geometry.workspace = true
msh-catalog.workspace = true
msh-ipc.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
base64.workspace = true
serde_json.workspace = true
zip.workspace = true
percent-encoding = "2"
uuid.workspace = true

[lints]
workspace = true
