[package]
name = "msh-app"
description = "My Sweet Home – Desktop-App"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Das Suffix `_lib` verhindert unter Windows einen Namenskonflikt mit dem Binary,
# siehe https://github.com/rust-lang/cargo/issues/8519
name = "msh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
msh-core.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
