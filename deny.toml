# cargo-deny configuration: licenses and sources of the Rust dependencies, checked in CI
# (`cargo deny check licenses sources`). Security advisories are checked with cargo-audit.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
# Licenses compatible with distributing the combined work under GPL-3.0-or-later
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates themselves (publish = false)
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
