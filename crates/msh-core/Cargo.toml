[package]
name = "msh-core"
description = "Core of My Sweet Home: document, commands, undo/redo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
msh-model.workspace = true
msh-format.workspace = true
msh-catalog.workspace = true
msh-geometry.workspace = true
msh-export.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
# Sun position: local date and time in the time zone of the compass
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Address search (OpenStreetMap Nominatim) for the location of the home
ureq = "2.12"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
