[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/christophwalser/my-sweet-home"
publish = false

[workspace.dependencies]
msh-core = { path = "crates/msh-core" }
msh-model = { path = "crates/msh-model" }
msh-format = { path = "crates/msh-format" }
msh-catalog = { path = "crates/msh-catalog" }
msh-geometry = { path = "crates/msh-geometry" }
msh-export = { path = "crates/msh-export" }
msh-ipc = { path = "crates/msh-ipc" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
schemars = "1.2"
uuid = { version = "1.29", features = ["v4"] }
resvg = "0.50"
base64 = "0.23"
anyhow = "1"
thiserror = "2"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Compression is slow without optimizations; keeps tests with large archives fast
[profile.dev.package]
miniz_oxide.opt-level = 3
flate2.opt-level = 3
crc32fast.opt-level = 3
zip.opt-level = 3
zlib-rs.opt-level = 3
