# Builds the release artifacts. A tag "<version>" without a "v", e.g. "0.1.0" (matching the
# version in Cargo.toml and tauri.conf.json), builds them and creates a draft GitHub release,
# which a maintainer reviews and publishes. "Run workflow" builds the artifacts without a release, for testing.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and check the version
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          $cargo = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          if ($cargo.Matches[0].Groups[1].Value -ne $version) {
            throw "Version mismatch: Cargo.toml $($cargo.Matches[0].Groups[1].Value), tauri.conf.json $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # No cache writes from release builds: keeps tag builds independent of PR caches
          save-if: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Collect artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $out = New-Item -ItemType Directory -Force dist-release
          # GitHub replaces spaces in the names of release files by dots: named so right away, the
          # names in SHA256SUMS.txt are those of the downloads
          foreach ($msi in Get-ChildItem target/release/bundle/msi/*.msi) {
            Copy-Item $msi.FullName (Join-Path $out.FullName ($msi.Name -replace ' ', '.'))
          }
          $legal = 'app/src-tauri/resources/legal'
          Copy-Item "$legal/THIRD-PARTY-NOTICES.txt" $out
          # Portable CLI: msh.exe with the license files
          $cli = New-Item -ItemType Directory -Force "target/cli/msh-$version-windows-x64"
          Copy-Item target/release/msh.exe, "$legal/LICENSE.txt", "$legal/NOTICE.md", "$legal/THIRD-PARTY-NOTICES.txt" $cli
          Compress-Archive -Path "$cli/*" -DestinationPath "$out/msh-$version-windows-x64.zip"
          # Hashes first, then the file (it must not list itself); LF line endings for sha256sum
          $sums = Get-ChildItem $out.FullName -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $out.FullName 'SHA256SUMS.txt'), (($sums -join "`n") + "`n"))
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist-release
      - name: Verify checksums
        working-directory: dist-release
        run: sha256sum --check SHA256SUMS.txt
      # Build provenance (gh attestation verify); only available for public repositories
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist-release/*.msi
            dist-release/*.zip
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ---
          **Installation:** download the `.msi` and run it. The installer is not code-signed yet,
          so Windows SmartScreen may warn ("More info" → "Run anyway"). Check the download with
          `SHA256SUMS.txt`. No furniture or texture libraries are included; see the README.
          EOF
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "My Sweet Home $TAG" \
            --notes-file notes.md
