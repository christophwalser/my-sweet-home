name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
  - type: textarea
    id: sh3d
    attributes:
      label: How does Sweet Home 3D handle it?
      description: If Sweet Home 3D has this feature, describe how it works there.
